<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TherapyAdmin AI</title>
<script>
// Route users based on auth state
try {
  const profile = JSON.parse(localStorage.getItem('ta_profile') || '{}');
  // Try to refresh token — if it works, go to dashboard
  fetch('/auth/refresh', {method:'POST',credentials:'include'})
    .then(r => {
      if (r.ok && profile.onboarded) window.location.href = '/dashboard.html';
      else if (r.ok) window.location.href = '/onboarding.html';
      else window.location.href = '/login.html';
    })
    .catch(() => window.location.href = '/login.html');
} catch {
  window.location.href = '/login.html';
}
</script>
</head>
<body style="font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:#f7f3ee">
<p style="color:#9a9088;font-size:14px">Loading TherapyAdmin AI...</p>
</body>
</html>
